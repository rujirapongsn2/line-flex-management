services:
  linedev:
    build: .
    container_name: softnix-linedev
    ports:
      - "3456:3456"
    volumes:
      - ./data:/app/data
    environment:
      NODE_ENV: production
      # Softnix GenAI on LAN IP uses self-signed cert; Node fetch otherwise throws "fetch failed"
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      PORT: "3456"
      DATABASE_URL: file:/app/data/linedev.db
      LINEDEV_SESSION_SECRET: ${LINEDEV_SESSION_SECRET:?set LINEDEV_SESSION_SECRET in .env}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://line.rujirapong.us}
      LONGDO_API_KEY: ${LONGDO_API_KEY:-}
      LONGDO_DEFAULT_TAGS: ${LONGDO_DEFAULT_TAGS:-}
      POI_SHARED_SECRET: ${POI_SHARED_SECRET:-}
      CHECKIN_SHARED_SECRET: ${CHECKIN_SHARED_SECRET:-}
    restart: unless-stopped
