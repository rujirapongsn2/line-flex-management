services:
  linedev:
    build: .
    container_name: softnix-linedev
    ports:
      - "3456:3456"
    volumes:
      - ./data:/app/data
    environment:
      NODE_ENV: production
      # Softnix GenAI on LAN IP uses self-signed cert; Node fetch otherwise throws "fetch failed"
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      PORT: "3456"
      DATABASE_URL: file:/app/data/linedev.db
      LINEDEV_SESSION_SECRET: ${LINEDEV_SESSION_SECRET:?set LINEDEV_SESSION_SECRET in .env}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://line.rujirapong.us}
      # Webhook signature: Dev may set ALLOW_UNSIGNED_WEBHOOK=1; Prod2 set REQUIRE_LINE_SIGNATURE=1
      ALLOW_UNSIGNED_WEBHOOK: ${ALLOW_UNSIGNED_WEBHOOK:-}
      REQUIRE_LINE_SIGNATURE: ${REQUIRE_LINE_SIGNATURE:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-90000}
      LLM_KNOWLEDGE_PASS: ${LLM_KNOWLEDGE_PASS:-}
      LIFF_ID: ${LIFF_ID:-}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      LONGDO_API_KEY: ${LONGDO_API_KEY:-}
      LONGDO_DEFAULT_TAGS: ${LONGDO_DEFAULT_TAGS:-}
      POI_SHARED_SECRET: ${POI_SHARED_SECRET:-}
      CHECKIN_SHARED_SECRET: ${CHECKIN_SHARED_SECRET:-}
    restart: unless-stopped
